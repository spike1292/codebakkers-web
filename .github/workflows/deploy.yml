name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Job-level env so steps can test for presence (the secrets context isn't available in job-level `if`).
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    strategy:
      matrix:
        include:
          - app: codebakkers
            project: codebakkers
          - app: henkbakker
            project: henkbakker
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ${{ matrix.app }} build
      - name: Skip deploy (Cloudflare secrets not configured)
        if: env.CF_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set — built successfully, skipping deploy."

      - name: Deploy ${{ matrix.project }} to Cloudflare Pages
        if: env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/${{ matrix.app }}/dist --project-name=${{ matrix.project }} --branch=${{ github.head_ref || github.ref_name }}
