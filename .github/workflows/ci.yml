name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build

  quality:
    runs-on: ubuntu-latest
    # Best-effort a11y + link checks. Flip continue-on-error to false once tuned.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Link check (internal links only)
        # Skip external URLs: codebakkers.com / henkbakker.net / codecask.cc aren't
        # necessarily live yet, and third-party sites shouldn't be able to fail our CI.
        run: |
          pnpm dlx linkinator apps/codebakkers/dist --recurse --silent --skip "^https?://"
          pnpm dlx linkinator apps/henkbakker/dist --recurse --silent --skip "^https?://"
      - name: Accessibility (pa11y-ci)
        run: |
          pnpm dlx http-server apps/codebakkers/dist -p 8081 -s &
          pnpm dlx http-server apps/henkbakker/dist -p 8082 -s &
          # Wait for both servers instead of a fixed sleep (pnpm dlx may need to fetch first).
          for port in 8081 8082; do
            for i in $(seq 1 30); do
              curl -sSf "http://localhost:$port/" > /dev/null && break
              sleep 1
            done
          done
          pnpm dlx pa11y-ci --config .pa11yci.json
